services:
  esphome:
    image: ${ESPHOME_IMAGE:-ghcr.io/esphome/esphome:dev}
    entrypoint: []
    command: ["sleep", "infinity"]
    working_dir: /workspaces/component
    volumes:
      - ..:/workspaces/component:cached
      - esphome-cache:/root/.cache/esphome
      - platformio-cache:/root/.platformio
      - validation-cache:/root/.cache/pip

volumes:
  esphome-cache:
    name: esphome-components-esphome-cache
  platformio-cache:
    name: esphome-components-platformio-cache
  validation-cache:
    name: esphome-components-validation-cache
