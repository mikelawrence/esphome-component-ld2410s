name: Create Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Next CalVer
        id: calver
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          # Published releases only (no drafts).
          gh api --paginate "repos/${GH_REPO}/releases?per_page=100" \
            | jq -s 'add' > releases.json

          # Match bare YY.M.N or YYYY.M.N only -- no prefixes accepted.
          # Normalize 2-digit years to 4 and emit "YYYY M N" per line.
          #   26.07.9  / 2026.7.10 / 26.12.1 -> match
          #   v26.07.3 / release-2026.7.4    -> no match
          #   026.7.9  / 2026.7.1-beta       -> no match
          jq -r '
            def to4($y): if $y < 100 then 2000 + $y else $y end;
            def num: sub("^0+(?=[0-9])"; "") | tonumber;
            .[]
            | select(.draft == false)
            | ((.tag_name // "")
                | capture("^(?<y>[0-9]{2}(?:[0-9]{2})?)\\.(?<m>[0-9]{1,2})\\.(?<n>[0-9]+)$")
              ) // empty
            | "\(to4(.y | num)) \(.m | num) \(.n | num)"
          ' releases.json | sort -k1,1n -k2,2n -k3,3n > calver.txt

          year=$(date -u +%Y)
          month=$(date -u +%-m)

          if [ -s calver.txt ]; then
            read -r p_y p_m p_n < <(tail -n1 calver.txt)
            prev_tag="${p_y}.${p_m}.${p_n}"
          else
            prev_tag=""
          fi

          # Highest N already used in the current year/month; 0 if none.
          current_max=$(awk -v y="$year" -v m="$month" \
            '$1==y && $2==m && $3>max {max=$3} END {print max+0}' calver.txt)

          new_tag="${year}.${month}.$((current_max + 1))"

          echo "prev_tag=$prev_tag" >> "$GITHUB_OUTPUT"
          echo "new_tag=$new_tag" >> "$GITHUB_OUTPUT"

          echo "Prev tag: ${prev_tag:-<none>}"
          echo "New tag:  $new_tag"

      - name: Create release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          tag_name: ${{ steps.calver.outputs.new_tag }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
